name: Auto Update Nodes

on:
  schedule:
    - cron: '0 0,12 * * *' # UTC 时间每天 0点和12点自动运行
  workflow_dispatch: # 添加这个选项，允许我们在网页上手动点击运行测试

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须赋予写入权限，否则脚本生成的 txt 文件无法推送到仓库

    steps:
      - name: 检出代码仓库
        uses: actions/checkout@v3

      - name: 设置 Python 环境
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 安装依赖包
        run: pip install requests

      - name: 运行节点抓取脚本
        run: python update_nodes.py

      - name: 提交并推送更新的文件
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add my_nodes.txt
          # 如果节点没变化，commit 会报错停止，所以加上 || echo 忽略报错
          git commit -m "Auto update free nodes" || echo "No changes to commit"
          git push